<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadet Thurst - Login</title>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        /* লোগোর জন্য নতুন স্টাইল */
        .logo {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #000000;
            margin-bottom: 5px;
        }

        .tagline {
            font-size: 14px;
            color: #333333;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 5px;
            color: #000000;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #000000;
            border-radius: 4px;
            font-size: 14px;
            color: #000000;
            background-color: #ffffff;
            outline: none;
        }

        input:focus {
            border-width: 2px;
        }

        .btn {
            width: 100%;
            padding: 10px;
            background-color: #000000;
            color: #ffffff;
            border: 1px solid #000000;
            border-radius: 4px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn:hover {
            background-color: #333333;
        }

        .toggle-text {
            margin-top: 20px;
            font-size: 13px;
            color: #000000;
        }

        .toggle-text a {
            color: #000000;
            font-weight: bold;
            text-decoration: underline;
            cursor: pointer;
        }

        .loader {
            display: none;
            margin: 10px auto;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #000000;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Custom Modal / Pop-up Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(2px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.2s ease-in-out;
        }

        .modal-box {
            background-color: #ffffff;
            padding: 25px 20px;
            border-radius: 8px;
            max-width: 320px;
            width: 90%;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            border: 1px solid #000;
        }

        .modal-icon {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .modal-message {
            font-size: 14px;
            margin-bottom: 20px;
            color: #333;
        }

        .modal-btn {
            background-color: #000;
            color: #fff;
            border: none;
            padding: 9px 25px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }

        .modal-btn:hover {
            background-color: #333;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- লোগো যুক্ত করা হয়েছে -->
    <img src="logo.png" alt="Cadet Thurst Logo" class="logo">
    
    <h1>Cadet Thurst</h1>
    <p class="tagline">An unofficial website of Sylhet Cadet College</p>

    <!-- Login Form -->
    <form id="loginForm">
        <div class="form-group">
            <label for="loginAccountName">Account Name</label>
            <input type="text" id="loginAccountName" placeholder="Enter Account Name" required>
        </div>
        <div class="form-group">
            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" placeholder="Enter Password" required>
        </div>
        <button type="submit" class="btn" id="loginBtn">Log in</button>
        <div class="loader" id="loginLoader"></div>
        <p class="toggle-text">
            Haven't Any Account? <a href="register.html">Create a New Account</a>
        </p>
    </form>
</div>

<!-- Custom Universal Alert Popup -->
<div class="modal-overlay" id="customAlertModal">
    <div class="modal-box">
        <div class="modal-icon">⚠️</div>
        <div class="modal-message" id="modalAlertMessage">Warning message here</div>
        <button class="modal-btn" onclick="closeCustomAlert()">OK</button>
    </div>
</div>

<script>
    // Supabase Configuration
    const SUPABASE_URL = 'https://xoxzqaisapuhknqbdbqc.supabase.co'; 
    const SUPABASE_ANON_KEY = 'sb_publishable_bWKAvlmISCKe9X19IeMHCg_yazPa2at';
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const loginLoader = document.getElementById('loginLoader');

    // Pop-up Alert Functions
    function showPopupAlert(msg) {
        document.getElementById('modalAlertMessage').innerText = msg;
        document.getElementById('customAlertModal').style.display = 'flex';
    }

    function closeCustomAlert() {
        document.getElementById('customAlertModal').style.display = 'none';
    }

    // Login Submission Process
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const accountInput = document.getElementById('loginAccountName').value.trim();
        const password = document.getElementById('loginPassword').value;

        loginLoader.style.display = 'block';

        try {
            // ১. auth_users টেবিল থেকে account_name অনুযায়ী ইমেইল ও approved স্ট্যাটাস চেক
            const { data: userAuthData, error: userError } = await supabaseClient
                .from('auth_users')
                .select('email, approved')
                .eq('account_name', accountInput)
                .single();

            // অ্যাকাউন্ট নেম না মিললে
            if (userError || !userAuthData) {
                loginLoader.style.display = 'none';
                showPopupAlert("Account Not Found!");
                return;
            }

            // অ্যাকাউন্ট এডমিন কর্তৃক এপ্রুভ না থাকলে
            if (!userAuthData.approved) {
                loginLoader.style.display = 'none';
                showPopupAlert("Your account is pending admin approval!");
                return;
            }

            const emailToAuth = userAuthData.email;

            // ২. Supabase Auth-এ ইমেইল ও পাসওয়ার্ড যাচাইকরণ
            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: emailToAuth,
                password: password,
            });

            loginLoader.style.display = 'none';

            if (error) {
                showPopupAlert("Wrong Password!");
            } else if (data.session) {
                // তথ্য ঠিক থাকলে তবেই হোমপেজে রিডাইরেক্ট হবে
                window.location.href = 'homepage.html';
            }
        } catch (err) {
            loginLoader.style.display = 'none';
            showPopupAlert("Connection Error. Please try again.");
        }
    });
</script>

</body>
</html>
